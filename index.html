<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07080a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:site_name" content="RaPublisher" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_AU" />
    <script defer data-domain="rapublisher.com.au" src="https://plausible.io/js/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Static twin of the booking form so Netlify Forms detects its fields at deploy (A3). Never shown. -->
    <form name="site-walk" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="name" /><input name="business" /><input name="email" /><input name="phone" />
      <input name="role" /><input name="team" /><input name="industry" /><input name="suburb" /><textarea name="message"></textarea>
      <input name="systems" /><input name="budget" /><input name="heard" /><input name="times" /><input name="consent" />
      <input name="consent_at" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
